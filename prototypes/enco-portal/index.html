<!doctype html>
<!--
================================================================================
 ENCO – Portal Web · Protótipo (v3.0.0 - DEV)
 Só a casca fica aqui: topbar e menu lateral. Estilos em assets/css/styles.css
 e comportamento em assets/js/main.js (módulos ES). Estrutura, telas e regras: README.md.

 TELAS
 home (Início) · planos (Gestão de Planos, com geração de relatório) · dashboards · rotas
 coletas (desligada por feature flag, ver assets/js/config.js)
 veiculos · tipos · macro · pontos (Pontos de descarga) · nc (Não conformidades)
 prioridades · movimentos (Parâmetros) · perfis · areas · usuarios · configuracoes · logs (aba de Configurações)

 PONTOS DE OBSERVAÇÃO GERAIS
 [OBS-01] Todos os dados são fictícios (planos, pontos, e-mails, 8IDs, números SAP).
 [OBS-02] Os planos de exemplo têm datas de setembro/2026, mas a Home e o Dashboard
          trabalham com datas relativas a "hoje". Na implementação, tudo vem da API.
 [OBS-03] Alterações em cadastros ficam só em memória: recarregar volta ao início.
 [OBS-04] Comentários "[OBS-xx]" dentro das telas marcam decisões pendentes ou
          regras a confirmar com o negócio. "[REAL]" marca ajustes feitos para
          refletir o código atual (API .NET / Angular / banco).
================================================================================
-->
