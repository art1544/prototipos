<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Protótipo navegável do Portal web do Mobilidade: análise, dashboard, ordens, notas, eventos, perfis, alertas e diagnóstico.">
<title>Mobilidade – Portal web</title>
<link rel="icon" href="assets/img/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<script src="assets/js/app.js" defer></script>
</head>
<body>
<div class="login" id="login">
 <aside class="l-brand"><img class="l-icon" src="assets/img/icone.png" alt="Ícone Mobilidade"><h1>Mobilidade</h1><p>Gestão de manutenção - Portal Web</p><span class="l-ver">v1.0.0 · DEV</span></aside>
 <main class="l-panel"><div class="l-form"><h2>Fazer Login</h2><p class="sub">Use o mesmo usuário e senha da rede Ternium</p>
  <div id="lForm">
   <div class="l-f" id="lfU"><div class="l-row"><label for="uUser">Usuário</label><span class="l-count" id="lc">0/20</span></div><div class="l-inp"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><input id="uUser" maxlength="20" placeholder="Digite seu usuário de rede (8ID)" autocomplete="username"></div><p class="l-err">Informe seu usuário 8ID.</p></div>
   <div class="l-f" id="lfP"><div class="l-row"><label for="uPass">Senha</label><button type="button" class="l-forgot" id="lForgot">Esqueci minha senha</button></div><div class="l-inp"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><input id="uPass" type="password" placeholder="Digite sua senha" autocomplete="current-password"><button type="button" class="l-eye" id="lEye" aria-label="Mostrar senha"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><p class="l-err">Informe sua senha.</p></div>
   <button class="l-btn" id="lBtn" type="button">Entrar</button>
   <a class="l-catalog" href="../../">Todos os protótipos</a>
  </div></div></main>
</div>
<div class="app" id="app" hidden>
 <header class="topbar">
  <button class="ib" style="color:#F26A1B" aria-label="Recolher menu" id="toggleSide"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg></button>
  <img class="logo" src="assets/img/logo.png" alt="">
  <div class="brand"><span class="brand-name">Mobilidade<span class="hide-s"> - Portal web</span></span><span class="divider"></span><span class="version">v1.0.0 - DEV</span></div>
  <div class="spacer"></div>
  <label class="profile"><span>Perfil</span><select class="inp" id="perfilSel" style="height:36px;width:170px;font-weight:600"></select></label>
  <button class="ib bell" id="bell" data-act="go" data-v="alertas" aria-label="Alertas" title="Alertas"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="bdg" id="bellN" hidden></span></button>
  <span class="divider" style="height:24px;background:#E8E9F0"></span>
  <div class="um-wrap"><button type="button" class="user" id="userBtn" aria-haspopup="true" aria-expanded="false" aria-controls="userMenu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span class="user-name">Paola Santiago</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
   <div class="um" id="userMenu" role="menu" hidden><div class="um-h"><b>Paola Santiago</b><span>psantiag@ternium.com.br</span><span id="umPerfil"></span></div>
    <div class="um-s"><span class="um-l"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20a15 15 0 0 1 0-20"/></svg>Idioma</span><button type="button" role="menuitemradio" class="um-i" data-lang="pt">Português</button><button type="button" role="menuitemradio" class="um-i" data-lang="es" lang="es">Español</button><button type="button" role="menuitemradio" class="um-i" data-lang="en" lang="en">English</button></div>
    <div class="um-s"><button type="button" role="menuitem" class="um-i" id="umSair"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>Sair</button></div></div></div>
  <button class="ib" aria-label="Sair" title="Sair" id="sair"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></button>
 </header>
 <div class="body"><nav class="sidebar" id="sidebar" aria-label="Menu principal"></nav><main class="main" id="main"></main></div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="tip" id="tip" hidden></div>
</body>
</html>
